name: Mod Template

on:
  push:
  workflow_dispatch:

jobs:

  initialize:
    name: Initialize

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize
        shell: cmd
        run: |
          echo ModName | initialize.bat

      - name: Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Initialize
          path: .
